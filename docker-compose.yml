version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: openmusic_app
    ports:
      - '5000:5000'
    env_file:
      - .env.development
    depends_on:
      - db
      - redis
      - rabbitmq
    command: npm run start:dev

  db:
    image: postgres:15-alpine
    container_name: openmusic_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openmusic
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: openmusic_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mail.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - '5050:80'
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    container_name: openmusic_redis
    ports:
      - '6379:6379'

  rabbitmq:
    image: rabbitmq:3-management
    container_name: openmusic_rabbitmq
    ports:
      - '5672:5672' # port untuk koneksi app
      - '15672:15672' # dashboard web rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'check_port_connectivity']
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: openmusic_consumer
    env_file:
      - .env.development
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
